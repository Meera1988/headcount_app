
<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0">

 

  <title>Headcount</title>

 

  <link

    rel="manifest"

    href="manifest.webmanifest">

 

  <meta

    name="theme-color"

    content="#4338ca">

</head>

 

<body>

 

  <h2>Headcount API Test</h2>

 

  <div id="result">

    Testing connection...

  </div>

 

  <script>

 

    const API_URL =

      https://script.google.com/macros/s/AKfycbwVe6i6iLyiCjOzsVv4oS9wiEHMLyaqlXBaY_Its9BP-PqkituL5g34-F7Owtnqhtw8/exec;

 
fetch(

  API_URL + "?action=test",

  {

    method: "GET",

    redirect: "follow"

  }

)
    

      .then(function(data) {

 

        document.getElementById("result").innerHTML =

          "SUCCESS<br><br>" +

          data.message;

 

      })

      .catch(function(error) {

 

        document.getElementById("result").innerHTML =

          "FAILED<br><br>" +

          error.message;

 

      });

 

  </script>

 

</body>

</html>
