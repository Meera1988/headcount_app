<!DOCTYPE html>

<html lang="en">

 

<head>

    body {

      border: none;

      display: block;

    }

 

  </style>

<body>

    id="app"

  </iframe>

 

  <script>

 

    if ("serviceWorker" in navigator) {

 

      window.addEventListener(

        "load",

        function() {

 

          navigator.serviceWorker

            .register("./sw.js");

 

        }

      );

 

    }

 

  </script>

 

</body>

 

</html>
